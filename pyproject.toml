mysqlclient = "*"

numpy = "*"
oauthlib = "*"
#pandas = "*"
pandas-datareader = '*'
piny = "*"
pip = "*"

# requires: sudo apt install libpq-dev
#psycopg2 = "*"
psycopg2-binary = "*"

# pyyaml = "*"
pyzmq = "*"
# requests = "*"
requests-oauthlib = "*"
seaborn = "*"
# scikit-learn = "*"
# scikit-image = "*"
# scipy = "*"
# six = ">=1.7.0,<=1.15.0"
# sklearn = "*"
SQLAlchemy = "*"
sympy = "*"
toml = "*"
urllib3 = "*"




[tool.poetry.dev-dependencies]


pytest = { version = "*" }
pytest-flask = "*"
pytest-cov = "*"
unittest2 = { version = "*" }
#   pytest-spark = "*"
#   pyspark-test = "*"
#   chispa = "*"
coverage= "*"
bumpversion = "*"
colorama = "*"
mock = "*"
more-itertools = "*"
nose = "*"
py = "*"
pylint = "*"
flake8 = "*"
pyproject-flake8 = "*"
jedi = "*"
autopep8 = "*"
yapf = '*'
pyright = '*'
#codecov = "*"
black = { extras = ["jupyter"], version = "*" }
isort = "*"
mypy = "*"
tornado = "*"
jupyter-core = "*"
notebook = "*"
ipykernel = "*"
jupyter = "*"
jupyter-rsession-proxy = "*"
jupyterlab = "*"
lux-api = "*"
sphinx = "*"
nbsphinx = "*"
sphinx-autoapi = "*"
sphinx-rtd-theme = "*"
twine = '*'
setuptools = "*"
wheel = "*"

[tool.poetry.dependencies.rootpath]
git = "https://github.com/hute37/python-rootpath"
branch = "stable"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]

# @see: https://github.com/microsoft/pyright/blob/main/docs/configuration.md
[tool.pyright]
include = ["src", "tests", "notebooks"]
exclude = ["**/node_modules",
    "**/__pycache__",
    "docker",
    "notes",
    "data",
    "logs",
    "temp"
]
ignore = ["build"]
defineConstant = { DEBUG = true }
#stubPath = "src/stubs"
#venv = "env367"

typeCheckingMode = "basic"
reportMissingImports = true



# flake8 config unused, @see setup.cfg
# [tool.flake8]
# max-line-length = 88
# extend-ignore = "E203,"
# max-complexity = 10

[tool.isort]
profile = "black"

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'
exclude = '''

(
  /(
      \.eggs         # exclude a few common directories in the
    | \.git          # root of the project
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
  )/
  | foo.py           # also separately exclude a file named foo.py in
                     # the root of the project
)
'''



[build-system]
requires = [
    "poetry-core>=1.0.0",
    "setuptools",
    "wheel",
    "incremental",
]
build-backend = "poetry.core.masonry.api"
#build-backend = "setuptools.build_meta"


