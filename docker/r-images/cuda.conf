##
#  /etc/build.conf: build-time environment configuration
#

# ---(build debug)---------------------------

Y_DEBUG=0
#Y_DEBUG_ENV=0  # Dockerfile ARG: Y_DEBUG_ENV


# //////////////////////////////////////////////////
# /// CUDA
# //////////////////////////////////////////////////

# ---(globals)---------------------------

Y_NV_ANY_SUPPORT=1

Y_NV_CUDA_SETUP=12.560.zzz

#Y_NV_CUDA_SETUP=12.560
#Y_NV_CUDA_SETUP=11.470

Y_NV_CUDA_VERSION=11.8

# ---(cuda)---------------------------

Y_NV_CUDA_SUPPORT=1
Y_NV_CUDA_DRIVER=1
Y_NV_CUDA_COMPAT=0
Y_NV_CUDA_LINKER=0
Y_NV_CUDA_BLAS=0
Y_NV_CUDA_COMPILER=1
Y_NV_CUDA_CUDNN=1
Y_NV_CUDA_NVINFER=1
Y_NV_CUDA_LIBRARIES=1
Y_NV_CUDA_TOOLS=1
Y_NV_CUDA_NVTOP=1
Y_NV_CUDA_CHECK=1

